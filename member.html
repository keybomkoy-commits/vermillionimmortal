<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="docTitle">MEMBER ELITE - รายชื่อสมาชิก</title>
    <link rel="icon" href="ELITE.icon" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase Auth & Firestore -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { min-height: 100%; font-family: 'Chakra Petch', sans-serif; color: #ffffff; background-color: #050505; overflow-x: hidden; }
        .background { position: fixed; top: -20px; left: -20px; width: calc(100% + 40px); height: calc(100% + 40px); background-color: #111; background-image: url('bg.jpg'); background-position: center; background-size: cover; background-repeat: no-repeat; z-index: 1; animation: bgZoom 20s infinite alternate ease-in-out; }
        .background-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(5, 5, 8, 0.85), rgba(5, 5, 8, 0.95)); z-index: 2; }
        @keyframes bgZoom { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }
        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px 80px 20px; position: relative; z-index: 10; }
        .top-nav { margin-bottom: 20px; animation: fadeInDown 1s ease-out both; display: flex; justify-content: space-between; align-items: center; }
        .btn-nav { display: inline-block; text-decoration: none; color: #ffffff; font-family: 'Orbitron', sans-serif; font-size: 0.9rem; background: rgba(255, 255, 255, 0.05); padding: 8px 15px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease; cursor: pointer; }
        .btn-nav:hover { background: rgba(255, 255, 255, 0.1); border-color: #fff; }
        .btn-admin { background: rgba(255, 71, 87, 0.1); border-color: rgba(255, 71, 87, 0.3); color: #ff4757; }
        .btn-admin:hover { background: rgba(255, 71, 87, 0.2); border-color: #ff4757; box-shadow: 0 0 10px rgba(255, 71, 87, 0.4); }
        .header-center { display: flex; flex-direction: column; align-items: center; margin-bottom: 50px; animation: fadeInDown 1s ease-out 0.2s both; }
        .main-page-title { font-family: 'Orbitron', sans-serif; font-size: 4rem; font-weight: 900; letter-spacing: 12px; color: #ffffff; text-transform: uppercase; margin-bottom: 20px; text-shadow: 0 0 20px rgba(255, 255, 255, 0.4), 0 0 40px rgba(30, 144, 255, 0.2); text-align: center; }
        .search-box { width: 100%; max-width: 500px; }
        #searchInput { width: 100%; padding: 12px 25px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.5); color: #ffffff; font-family: 'Orbitron', sans-serif; font-size: 1rem; outline: none; text-align: center; backdrop-filter: blur(5px); transition: all 0.3s ease; }
        #searchInput:focus { border-color: #1E90FF; background: rgba(0, 0, 0, 0.7); box-shadow: 0 0 15px rgba(30, 144, 255, 0.3); }
        .category-section { margin-bottom: 40px; animation: fadeInUp 1s ease-out both; transition: opacity 0.3s ease; }
        .category-header { display: flex; align-items: baseline; margin-bottom: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 8px; }
        .category-title { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 700; letter-spacing: 2px; margin-right: 10px; }
        .member-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .member-card { background: rgba(20, 20, 25, 0.6); backdrop-filter: blur(5px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 12px 15px; display: flex; align-items: center; gap: 15px; transition: all 0.3s ease; }
        .member-card:hover { background: rgba(30, 30, 40, 0.8); transform: translateY(-2px); }
        .card-gold { border-left: 3px solid #FFD700; } .text-gold { color: #FFD700; }
        .card-red { border-left: 3px solid #FF4757; } .text-red { color: #FF4757; }
        .card-blue { border-left: 3px solid #1E90FF; } .text-blue { color: #1E90FF; }
        .card-green { border-left: 3px solid #2ED573; } .text-green { color: #2ED573; }
        .member-card:hover.card-gold { box-shadow: 0 5px 15px rgba(255, 215, 0, 0.15); border-color: rgba(255, 215, 0, 0.5); }
        .member-card:hover.card-red { box-shadow: 0 5px 15px rgba(255, 71, 87, 0.15); border-color: rgba(255, 71, 87, 0.5); }
        .member-card:hover.card-blue { box-shadow: 0 5px 15px rgba(30, 144, 255, 0.15); border-color: rgba(30, 144, 255, 0.5); }
        .member-card:hover.card-green { box-shadow: 0 5px 15px rgba(46, 213, 115, 0.15); border-color: rgba(46, 213, 115, 0.5); }
        .avatar { position: relative; width: 55px; height: 55px; border-radius: 50%; background: rgba(255, 255, 255, 0.05); display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        .avatar img { max-width: 35px; height: auto; opacity: 0.8; }
        .status-dot { position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px; background-color: #2ed573; border: 2px solid #141419; border-radius: 50%; }
        .member-info { display: flex; flex-direction: column; justify-content: center; width: 100%; }
        .member-role { font-family: 'Orbitron', sans-serif; font-size: 0.65rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 2px; }
        .member-name { font-size: 1.1rem; font-weight: 600; color: #ffffff; margin-bottom: 2px; }
        .fb-link { font-size: 0.8rem; color: #1E90FF; text-decoration: none; transition: color 0.3s; } .fb-link:hover { color: #ffffff; text-decoration: underline; }
        #particles-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
        .particle { position: absolute; background-color: rgba(255, 255, 255, 0.6); border-radius: 50%; animation: snowfall linear infinite; }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes snowfall { 0% { transform: translateY(-10vh) translateX(0); opacity: 1; } 100% { transform: translateY(110vh) translateX(20px); opacity: 0; } }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px); z-index: 999; display: none; justify-content: center; align-items: center; }
        .modal-box { background: rgba(20, 20, 25, 0.9); border: 1px solid rgba(255, 71, 87, 0.5); border-radius: 12px; padding: 30px; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(255, 71, 87, 0.1); text-align: center; animation: fadeInUp 0.3s ease-out; }
        .modal-title { font-family: 'Orbitron', sans-serif; color: #ff4757; font-size: 1.5rem; margin-bottom: 20px; letter-spacing: 2px; }
        .login-input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.6); color: #fff; font-family: 'Chakra Petch', sans-serif; outline: none; }
        .login-input:focus { border-color: #ff4757; }
        .captcha-box { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.4); padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .captcha-question { font-weight: 600; color: #2ed573; }
        .captcha-input { width: 80px; padding: 8px; text-align: center; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); background: #000; color: #fff; outline: none; }
        .modal-btn-group { display: flex; gap: 10px; }
        .btn-modal { flex: 1; padding: 12px; border-radius: 8px; border: none; font-family: 'Orbitron', sans-serif; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-submit { background: #ff4757; color: #fff; } .btn-submit:hover { background: #ff6b81; box-shadow: 0 0 15px rgba(255,71,87,0.4); }
        .btn-cancel { background: #555; color: #fff; } .btn-cancel:hover { background: #777; }
        
        @media (max-width: 768px) { .main-page-title { font-size: 2.5rem; letter-spacing: 6px; } .member-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="background-overlay"></div>
    <div id="particles-container"></div>

    <div class="container">
        <div class="top-nav">
            <a href="index.html" class="btn-nav">◀ BACK</a>
            <button onclick="openLogin()" class="btn-nav btn-admin">⚙ ADMIN LOGIN</button>
        </div>

        <div class="header-center">
            <h1 class="main-page-title" id="displayMainTitle">ELITESTYLE</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="SEARCH MEMBER..." onkeyup="searchMember()">
            </div>
        </div>

        <div class="category-section" id="cat-owner"><div class="category-header"><h2 class="category-title text-gold">OWNERS</h2></div><div class="member-grid"></div></div>
        <div class="category-section" id="cat-leader"><div class="category-header"><h2 class="category-title text-red">LEADERS</h2></div><div class="member-grid"></div></div>
        <div class="category-section" id="cat-support"><div class="category-header"><h2 class="category-title text-blue">SUPPORTS</h2></div><div class="member-grid"></div></div>
        <div class="category-section" id="cat-member"><div class="category-header"><h2 class="category-title text-green">MEMBERS</h2></div><div class="member-grid"></div></div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal-box">
            <h2 class="modal-title">ADMINISTRATOR</h2>
            <input type="email" id="lEmail" class="login-input" placeholder="Email...">
            <input type="password" id="lPass" class="login-input" placeholder="Password...">
            
            <div class="captcha-box">
                <span class="captcha-question" id="captchaText"></span>
                <input type="number" id="lCaptcha" class="captcha-input" placeholder="ผลลัพธ์">
            </div>

            <div class="modal-btn-group">
                <button class="btn-modal btn-submit" id="btnLoginBtn" onclick="verifyLogin()">LOGIN</button>
                <button class="btn-modal btn-cancel" onclick="closeLogin()">CANCEL</button>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ ใส่ Firebase Config ตรงนี้
        const firebaseConfig = {
            apiKey: "AIzaSyACXGoNXUMf8jciZNZpPUTavu24SPYKmEE",
            authDomain: "qaqenv1vml-59205.firebaseapp.com",
            projectId: "qaqenv1vml-59205",
            storageBucket: "qaqenv1vml-59205.firebasestorage.app",
            messagingSenderId: "20480642329",
            appId: "1:20480642329:web:b90eec4807607470ef4988",
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        let globalLogo = 'ELITE.png'; 

        function updateText(id, value, defaultValue) {
            const el = document.getElementById(id);
            if (el) el.innerHTML = (value !== undefined && value !== '') ? value : defaultValue;
        }

        db.collection("site").doc("design").onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                updateText('docTitle', data.memberDocTitle, 'MEMBER ELITE - รายชื่อสมาชิก');
                updateText('displayMainTitle', data.memberMainTitle, 'ELITESTYLE');

                if (data.bgUrl) {
                    const bgElement = document.querySelector('.background');
                    if (bgElement) bgElement.style.backgroundImage = `url('${data.bgUrl}')`;
                }
                if (data.iconUrl) {
                    let link = document.querySelector("link[rel~='icon']");
                    if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
                    link.href = data.iconUrl;
                }
                if (data.logoUrl) {
                    globalLogo = data.logoUrl;
                    document.querySelectorAll('.avatar img').forEach(img => img.src = globalLogo);
                }
            }
        });

        db.collection("members").orderBy("createdAt", "asc").onSnapshot((snapshot) => {
            document.querySelector('#cat-owner .member-grid').innerHTML = '';
            document.querySelector('#cat-leader .member-grid').innerHTML = '';
            document.querySelector('#cat-support .member-grid').innerHTML = '';
            document.querySelector('#cat-member .member-grid').innerHTML = '';

            snapshot.forEach((doc) => renderCard(doc.data()));
            searchMember(); 
        });

        function renderCard(data) {
            let colorClass, titleClass, gridId;
            if(data.category === 'owner') { gridId = '#cat-owner .member-grid'; colorClass = 'card-gold'; titleClass = 'text-gold'; }
            else if(data.category === 'leader') { gridId = '#cat-leader .member-grid'; colorClass = 'card-red'; titleClass = 'text-red'; }
            else if(data.category === 'support') { gridId = '#cat-support .member-grid'; colorClass = 'card-blue'; titleClass = 'text-blue'; }
            else { gridId = '#cat-member .member-grid'; colorClass = 'card-green'; titleClass = 'text-green'; }

            const cardHTML = `
                <div class="member-card ${colorClass}">
                    <div class="avatar"><img src="${globalLogo}" alt="logo"><div class="status-dot"></div></div>
                    <div class="member-info">
                        <span class="member-role ${titleClass}">${data.role}</span>
                        <span class="member-name">${data.name}</span>
                        <a href="${data.fb}" target="_blank" class="fb-link">Facebook</a>
                    </div>
                </div>`;
            document.querySelector(gridId).insertAdjacentHTML('beforeend', cardHTML);
        }

        function searchMember() {
            let input = document.getElementById('searchInput').value.toUpperCase();
            let cards = document.querySelectorAll('.member-card');
            cards.forEach(card => {
                let name = card.querySelector('.member-name').innerText.toUpperCase();
                card.style.display = (name.indexOf(input) > -1) ? "flex" : "none";
            });

            document.querySelectorAll('.category-section').forEach(category => {
                let hasVisibleCard = Array.from(category.querySelectorAll('.member-card')).some(card => card.style.display !== "none");
                category.style.display = hasVisibleCard ? "block" : "none";
            });
        }

        window.onload = function() {
            const container = document.getElementById('particles-container');
            for (let i = 0; i < 40; i++) {
                let p = document.createElement('div'); p.classList.add('particle');
                p.style.width = p.style.height = (Math.random() * 3 + 1) + 'px';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDuration = (Math.random() * 8 + 5) + 's';
                p.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(p);
            }
        };

        let captchaAnswer = 0;
        function openLogin() { document.getElementById('loginModal').style.display = 'flex'; generateCaptcha(); }
        function closeLogin() { document.getElementById('loginModal').style.display = 'none'; document.getElementById('lEmail').value = ''; document.getElementById('lPass').value = ''; document.getElementById('lCaptcha').value = ''; }
        function generateCaptcha() {
            let num1 = Math.floor(Math.random() * 10) + 1;
            let num2 = Math.floor(Math.random() * 10) + 1;
            captchaAnswer = num1 + num2;
            document.getElementById('captchaText').innerText = `ANTI-BOT: ${num1} + ${num2} = ?`;
            document.getElementById('lCaptcha').value = '';
        }
        
        function verifyLogin() {
            // ใช้ .trim() เพื่อตัดช่องว่างที่อาจเผลอกดติดมาด้านหน้าหรือด้านหลังทิ้งอัตโนมัติ
            const email = document.getElementById('lEmail').value.trim();
            const pass = document.getElementById('lPass').value.trim();
            const captcha = parseInt(document.getElementById('lCaptcha').value);
            const btn = document.getElementById('btnLoginBtn');

            if (captcha !== captchaAnswer) { 
                alert("คำตอบยืนยันบอทไม่ถูกต้อง!"); 
                generateCaptcha(); 
                return; 
            }
            
            btn.innerText = "LOADING...";
            
            // เข้าสู่ระบบ
            auth.signInWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    window.location.href = "admin.html"; 
                })
                .catch((error) => {
                    // เปลี่ยนมาแสดงข้อความ Error จากระบบ Firebase โดยตรง
                    alert("แจ้งเตือนจากระบบ: " + error.code + "\n\nสาเหตุ: " + error.message);
                    btn.innerText = "LOGIN";
                    generateCaptcha();
                });
        }
    </script>
</body>
</html>
