<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="docTitle">VERMILLION</title>
    
    <link rel="icon" href="" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { height: 100%; font-family: 'Chakra Petch', sans-serif; color: #ffffff; overflow: hidden; background-color: #000000; }
        .background { position: fixed; top: -20px; left: -20px; width: calc(100% + 40px); height: calc(100% + 40px); background-color: #2a2a2a; background-image: url('bg.jpg'); background-position: center; background-size: cover; background-repeat: no-repeat; z-index: 1; animation: bgZoom 20s infinite alternate ease-in-out; }
        .background-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(5, 10, 15, 0.65), rgba(5, 10, 15, 0.85)); z-index: 2; }
        @keyframes bgZoom { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }
        
        .container { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; padding: 20px; position: relative; z-index: 10; }
        .title-group { text-align: center; margin-bottom: 40px; width: 100%; }
        .main-title { font-family: 'Orbitron', sans-serif; font-size: 5rem; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; color: #ffffff; animation: textEntrance 1.5s cubic-bezier(0.215, 0.610, 0.355, 1.000) both, textGlow 3s infinite alternate ease-in-out 1.5s; }
        .sub-title { font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: 700; letter-spacing: 12px; color: rgba(255, 255, 255, 0.6); text-transform: uppercase; animation: fadeInDown 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.5s both; }
        
        .glass-box { background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 60px 40px; text-align: center; margin-bottom: 40px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(255, 255, 255, 0.05); width: 750px; max-width: 95%; display: flex; justify-content: center; align-items: center; animation: fadeInUp 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.8s both, floatObj 6s ease-in-out infinite; position: relative; overflow: hidden; }
        .glass-box::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(100, 200, 255, 0.1) 0%, transparent 60%); opacity: 0.5; pointer-events: none; }
        .glass-box img { max-width: 250px; height: auto; filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.8)); transition: transform 0.4s ease; z-index: 2; }
        .glass-box:hover img { transform: scale(1.05); }
        
        .menu-container { display: flex; flex-direction: column; align-items: center; gap: 15px; animation: fadeInUp 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1s both; }
        .btn-member { text-decoration: none; color: #ffffff; background: rgba(20, 25, 35, 0.8); border: 1px solid rgba(100, 150, 255, 0.4); padding: 18px 70px; border-radius: 8px; text-align: center; transition: all 0.3s ease; backdrop-filter: blur(8px); box-shadow: 0 0 15px rgba(100, 150, 255, 0.15); width: 100%; max-width: 350px; }
        .btn-member:hover { background: rgba(100, 150, 255, 0.2); border-color: rgba(100, 150, 255, 1); transform: translateY(-5px); box-shadow: 0 10px 25px rgba(100, 150, 255, 0.4); }
        .btn-title { display: block; font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 700; letter-spacing: 4px; }
        .btn-subtitle { display: block; font-size: 0.8rem; color: #b0c4de; letter-spacing: 2px; margin-top: 6px; }
        
        .btn-contact { text-decoration: none; color: rgba(255, 255, 255, 0.6); background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.2); padding: 8px 20px; border-radius: 20px; font-size: 0.85rem; font-family: 'Chakra Petch', sans-serif; transition: all 0.3s ease; backdrop-filter: blur(5px); display: inline-flex; align-items: center; gap: 8px; }
        .btn-contact:hover { color: #ffffff; background: rgba(30, 144, 255, 0.2); border-color: #1E90FF; box-shadow: 0 0 15px rgba(30, 144, 255, 0.3); transform: translateY(-2px); }

        .footer-text { position: absolute; bottom: 45px; font-size: 0.95rem; letter-spacing: 5px; color: rgba(255, 255, 255, 0.7); text-transform: uppercase; animation: fadeIn 1s ease 1.2s both; z-index: 20; text-align: center; width: 100%; }
        .footer-text strong { font-family: 'Orbitron', sans-serif; color: #ffffff; font-weight: 700; text-shadow: 0 0 5px rgba(255,255,255,0.5); letter-spacing: 6px; }
        
        /* ลิขสิทธิ์ระบบ แก้ไขผ่านเว็บไม่ได้ */
        .system-design { position: absolute; bottom: 15px; font-size: 0.65rem; font-family: 'Orbitron', sans-serif; letter-spacing: 3px; color: rgba(255, 255, 255, 0.3); text-transform: uppercase; animation: fadeIn 1s ease 1.5s both; z-index: 20; text-align: center; width: 100%; }
        
        @keyframes textEntrance { 0% { opacity: 0; transform: translateY(-30px) scale(1.1); letter-spacing: 30px; filter: blur(10px); } 100% { opacity: 1; transform: translateY(0) scale(1); letter-spacing: 12px; filter: blur(0); } }
        @keyframes textGlow { 0% { text-shadow: 0 0 10px rgba(255, 255, 255, 0.3), 0 0 20px rgba(100, 150, 255, 0.2); } 100% { text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 40px rgba(100, 150, 255, 0.6), 0 0 60px rgba(100, 150, 255, 0.4); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes floatObj { 0% { transform: translateY(0px); } 50% { transform: translateY(-12px); } 100% { transform: translateY(0px); } }
        
        #particles-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
        .particle { position: absolute; background-color: rgba(255, 255, 255, 0.8); border-radius: 50%; box-shadow: 0 0 10px rgba(255, 255, 255, 0.5); animation: snowfall linear infinite; }
        @keyframes snowfall { 0% { transform: translateY(-10vh) translateX(0); opacity: 1; } 100% { transform: translateY(110vh) translateX(30px); opacity: 0.3; } }
        
        @media (max-width: 768px) { .main-title { font-size: 2.8rem; animation: textEntranceMobile 1.5s ease-out both, textGlow 3s infinite alternate ease-in-out 1.5s; } @keyframes textEntranceMobile { 0% { opacity: 0; letter-spacing: 15px; filter: blur(5px); } 100% { opacity: 1; letter-spacing: 6px; filter: blur(0); } } .sub-title { font-size: 0.7rem; letter-spacing: 6px; } .glass-box { width: 100%; padding: 40px 20px; border-radius: 12px; } .btn-member { padding: 15px 40px; } .footer-text { font-size: 0.7rem; letter-spacing: 3px; bottom: 35px; } .system-design { font-size: 0.5rem; bottom: 10px; } }
    </style>
</head>
<body>

    <div class="background"></div>
    <div class="background-overlay"></div>
    <div id="particles-container"></div>

    <div class="container">
        <div class="title-group">
            <h1 class="main-title" id="displayMainTitle"></h1>
            <div class="sub-title" id="displaySubTitle"> &nbsp;  &nbsp; </div>
        </div>
        
        <div class="glass-box">
            <img src="" alt="">
        </div>

        <div class="menu-container">
            <a href="member.html" class="btn-member">
                <span class="btn-title">MEMBER</span>
                <span class="btn-subtitle">CLICK TO VIEW</span>
            </a>
            
            <!-- ใส่ลิ้งก์ Discord ลูกค้าที่นี่ -->
            <a href="https://discord.com/invite/qGapRqJsdw" target="_blank" class="btn-contact">
                💬 ติดต่อทำเว็ป
            </a>
        </div>

        <div class="footer-text" id="displayFooterText">
            SUPPORT BY PLAYERS <strong>WINTERFELL</strong>
        </div>
        
        <div class="system-design">
            SYSTEM DESIGN BY QA QEN
        </div>
    </div>

    <script>
        // ⚠️ ใส่ Firebase Config ตรงนี้
        const firebaseConfig = {
            apiKey: "AIzaSyACXGoNXUMf8jciZNZpPUTavu24SPYKmEE",
            authDomain: "qaqenv1vml-59205.firebaseapp.com",
            projectId: "qaqenv1vml-59205",
            storageBucket: "qaqenv1vml-59205.firebasestorage.app",
            messagingSenderId: "20480642329",
            appId: "1:20480642329:web:b90eec4807607470ef4988",
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        function updateText(id, value, defaultValue) {
            const el = document.getElementById(id);
            if (el) el.innerHTML = (value !== undefined && value !== '') ? value : defaultValue;
        }

        db.collection("site").doc("design").onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                updateText('docTitle', data.docTitle, '');
                updateText('displayMainTitle', data.indexMainTitle, '');
                updateText('displaySubTitle', data.indexSubTitle, ' &nbsp;  &nbsp; ');
                updateText('displayFooterText', data.footerText, ' <strong></strong>');

                if (data.bgUrl) {
                    const bgElement = document.querySelector('.background');
                    if (bgElement) bgElement.style.backgroundImage = `url('${data.bgUrl}')`;
                }
                if (data.iconUrl) {
                    let link = document.querySelector("link[rel~='icon']");
                    if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
                    link.href = data.iconUrl;
                }
                if (data.logoUrl) {
                    document.querySelectorAll('img[alt=""]').forEach(img => img.src = data.logoUrl);
                }
            }
        });

        window.onload = function() {
            const container = document.getElementById('particles-container');
            for (let i = 0; i < 60; i++) {
                let p = document.createElement('div'); p.classList.add('particle');
                p.style.width = p.style.height = (Math.random() * 3.5 + 1) + 'px';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDuration = (Math.random() * 8 + 6) + 's';
                p.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(p);
            }
        };
    </script>
</body>
</html>
